# ggen consumer configuration — frozen-duckdb
# 源 hierarchy: ~/ggen-marketplace/marketplace.toml → packs/<name>/pack.toml
#   → ontology.ttl → templates/ → gates/ → THIS projection.
# Generated files are consequences: edit the owning pack/ontology, never the
# projection. Hand-edits to frozen artifacts are detected by freeze_policy.
[project]
name = "frozen-duckdb"
version = "1.5.5"
description = "Drop-in replacement for the duckdb (duckdb-rs) crate backed by prebuilt DuckDB binaries"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "schema/domain.ttl"
standard_only = true
# C8 verify-gate chain: the two governing packs bind as closure-hashed
# imports (ggen 26.8.18's declarative-rules schema resolves [[packs]] only
# as a rule-local file-source registry and refuses [[ontology.pack]], so an
# import is the operative pack binding on this schema — every sync receipt
# hashes these files):
#   ggen-verify-pack         → ver: vocabulary (RequiredCheck/Check/…)
#   evidence-standing-pack   → es: standing vocabulary + individuals
imports = [
  "schema/verify.ttl",
  "../../ggen-marketplace/packs/ggen-verify-pack/ontology.ttl",
  "../../ggen-marketplace/packs/evidence-standing-pack/ontology.ttl",
]

[generation]
output_dir = "."
# Capability waves append [[generation.rules]] entries: each renders one
# consequence (gate/template output) from the pack ontologies. See
# docs/sjira/v26.9.21/ wave tickets for the owning ticket per rule.

# ── C8: verify-gate chain ────────────────────────────────────────────────
# Both rules read the SAME row source (schema/verify-gates.rq) over the
# union graph (policy facts: schema/verify.ttl; vocabularies: the two pack
# imports). Consequences are rendered with mode=Overwrite: sync stays
# authoritative, hand-edits to the projections do not survive a sync.
#
# Target-name law (C10 coordination): this Makefile claims `verify` and the
# `verify-*` namespace ONLY. It deliberately does not render `sync` or
# `gates` (C10's targets per docs/sjira/v26.9.21/C10.md).

[[generation.rules]]
name = "render-verify-gates"
query = { file = "schema/verify-gates.rq" }
template = { inline = '''
#!/usr/bin/env bash
# GENERATED by `ggen sync run` (rule render-verify-gates in ggen.toml).
# Consequence — edit schema/verify.ttl (the ver:RequiredCheck facts), never
# this file. Vocabularies: ver: packs/ggen-verify-pack,
# es: packs/evidence-standing-pack (bound via [ontology].imports).
# Runs every required check, records REAL exit codes as ver:Check facts in
# scripts/verify-evidence.ttl, and exits nonzero if any gate is red.
set -uo pipefail
cd "$(dirname "$0")/.."

EV="scripts/verify-evidence.ttl"
RECORDED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
GRAPH_HASH="unsynced"
if [ -f .ggen-v2/receipt.json ]; then
  GRAPH_HASH="$(python3 -c 'import json;print(json.load(open(".ggen-v2/receipt.json"))["payload"]["graph_hash"])' 2>/dev/null || echo unsynced)"
fi

NAMES=(); CODES=(); TOOLS=(); REDS=()
FAILED_RED=""

run_gate() { # name command redStandingName(lowercase, from es:standingName)
  name="$1"; cmd="$2"; red="$3"
  echo "=== [C8 gate] $name"
  log="$(mktemp -t verify-gate)"
  bash -c "$cmd" >"$log" 2>&1
  code=$?
  tail -n 3 "$log" | sed 's/^/    | /'
  rm -f "$log"
  NAMES+=("$name"); CODES+=("$code"); TOOLS+=("$cmd"); REDS+=("$red")
  if [ "$code" -ne 0 ] && [ -z "$FAILED_RED" ]; then FAILED_RED="$red"; fi
  return 0
}

{% for r in results %}{% if r.kind == "check" %}run_gate '{{ r.name }}' '{{ r.command }}' '{{ r.standing }}'
{% endif %}{% endfor %}
{% raw %}
{
  echo "# GENERATED by scripts/verify-gates.sh at $RECORDED_AT -- do not edit."
  echo "# Real exit codes from real runs of the schema/verify.ttl gate battery."
  echo "# Vocabulary: ver: packs/ggen-verify-pack; standing: es: evidence-standing-pack."
  echo "@prefix ver: <http://seanchatmangpt.github.io/packs/ggen-verify#> ."
  echo ""
  i=0
  while [ "$i" -lt "${#NAMES[@]}" ]; do
    echo "ver:check-${NAMES[$i]} a ver:Check ;"
    echo "    ver:name \"${NAMES[$i]}\" ;"
    echo "    ver:tool \"${TOOLS[$i]}\" ;"
    echo "    ver:exitCode ${CODES[$i]} ;"
    echo "    ver:verifiedGraphHash \"$GRAPH_HASH\" ;"
    echo "    ver:recordedAt \"$RECORDED_AT\" ."
    echo ""
    i=$((i + 1))
  done
} > "$EV"

TOTAL=${#NAMES[@]}
GREEN=0
i=0
while [ "$i" -lt "$TOTAL" ]; do
  [ "${CODES[$i]}" -eq 0 ] && GREEN=$((GREEN + 1))
  i=$((i + 1))
done
echo "verify-gates: $GREEN/$TOTAL gates green -> $EV (graph hash binding: $GRAPH_HASH)"
i=0
while [ "$i" -lt "$TOTAL" ]; do
  echo "  ${NAMES[$i]}: exit ${CODES[$i]}"
  i=$((i + 1))
done
{% endraw %}

if [ -n "$FAILED_RED" ]; then
  echo "STANDING: $(echo "$FAILED_RED" | tr '[:lower:]' '[:upper:]') (red gate above; evidence: $EV)"
  exit 1
fi
echo "STANDING: ALIVE — all $TOTAL gates green (evidence: $EV)"
''' }
output_file = "scripts/verify-gates.sh"
mode = "Overwrite"

[[generation.rules]]
name = "render-makefile-verify"
query = { file = "schema/verify-gates.rq" }
template = { inline = '''
# GENERATED by `ggen sync run` (rule render-makefile-verify in ggen.toml).
# Consequence — edit schema/verify.ttl / schema/verify-gates.rq, never this
# file. One-command gate battery (ticket docs/sjira/v26.9.21/C8.md):
#   make verify = verify-gates (rendered runner, records evidence)
#               + ggen sync run (render + receipt)
#               + ggen receipt verify (receipt chain check)
# Standing vocabulary (ALIVE/BLOCKED/BUILD_BROKEN/…) is rendered from the
# packs/evidence-standing-pack es:Standing facts; per-gate red standings
# from schema/verify.ttl fdv:redStanding. Target-name law: claims `verify`
# and `verify-*` only (`sync`/`gates` belong to C10).

{% for r in results %}{% if r.kind == "standing" %}# standing vocabulary (es:standingName): {{ r.name }}
{% endif %}{% endfor %}SHELL := /bin/bash

.PHONY: verify verify-gates{% for r in results %}{% if r.kind == "check" %} verify-{{ r.name }}{% endif %}{% endfor %}

verify: verify-gates
	ggen sync run
	ggen receipt verify

verify-gates:
	bash scripts/verify-gates.sh
{% for r in results %}{% if r.kind == "check" %}
verify-{{ r.name }}:
	bash -c '{{ r.command }}'
{% endif %}{% endfor %}''' }
output_file = "Makefile"
mode = "Overwrite"

[sync]
enabled = true
on_change = "manual"
validate_after = true
conflict_mode = "fail"

[rdf]
formats = ["turtle"]
default_format = "turtle"
strict_validation = false
