# ggen consumer configuration — frozen-duckdb
# 源 hierarchy: ~/ggen-marketplace/marketplace.toml → packs/<name>/pack.toml
#   → ontology.ttl → templates/ → gates/ → THIS projection.
# Generated files are consequences: edit the owning pack/ontology, never the
# projection. Hand-edits to frozen artifacts are detected by freeze_policy.
#
# Wave 4 / C3 (2026-09-21): repo-reconciliation-pack composition.
# DECLARATION NOTE (failed edge, recorded in C3.md History): the ticket named
# "[[ontology.pack]]" as the declaration table — ggen 26.8.18 has no such
# field (FM-CONFIG-003: unknown field `pack` under [ontology], empirically
# probed). The real mechanisms of this declarative-rules manifest are:
#   [[packs]]            — typed pack-dependency declarations (name/version/path)
#   [ontology].imports   — pack ontologies unioned into the SPARQL graph
#   [validation].gates   — pack gate/*.rq files executed as sync-refusing law
#   [[generation.rules]] — render consequences from the pack's queries/templates
# The reconciliation pack's own ontology.ttl is deliberately NOT imported: its
# example instances occupy the canonical ret: subjects and would co-render
# placeholders into the real v1.5.5 artifacts (probed 2026-09-21). The five
# dependency packs are imported — verified collision-free with every
# reconciliation query target (grep over their ontology.ttl, 2026-09-21).

[project]
name = "frozen-duckdb"
version = "1.5.5"
description = "Drop-in replacement for the duckdb (duckdb-rs) crate backed by prebuilt DuckDB binaries"
authors = ["Sean Chatman"]
license = "MIT"

[ontology]
source = "schema/domain.ttl"
standard_only = true
imports = [
  "/Users/sac/ggen-marketplace/packs/dry-run-publish-pack/ontology.ttl",
  "schema/reconciliation-vocab.ttl",
  "/Users/sac/ggen-marketplace/packs/repo-as-found-pack/ontology.ttl",
  "/Users/sac/ggen-marketplace/packs/repo-load-path-pack/ontology.ttl",
  "/Users/sac/ggen-marketplace/packs/repo-intervention-pack/ontology.ttl",
  "/Users/sac/ggen-marketplace/packs/temporary-works-pack/ontology.ttl",
  "/Users/sac/ggen-marketplace/packs/mermaid-pack/ontology.ttl",
]

[generation]
output_dir = "."
# One consequence per pack template: the pack's frontmatter SPARQL queries run
# verbatim as rule queries; the inline Tera bodies mirror the pack template
# bodies (frontmatter `rows`/`states`/`edges`/`deltas`/`obligations` become the
# declarative schema's `results` context or in-template sparql() calls).
# Outputs land under docs/sjira/v26.9.21/reconciliation/ (this ticket's
# rendered-docs scope) instead of the pack's canonical docs/retrofit paths.

# Pack dependencies (REUSE → COMPOSE → EXTEND before INVENT) declared with
# name/version/path; each resolves against ~/ggen-marketplace/packs/.
[[packs]]
name = "repo-reconciliation-pack"
version = "26.7.20"
path = "/Users/sac/ggen-marketplace/packs/repo-reconciliation-pack"

[[packs]]
name = "repo-as-found-pack"
version = "26.7.20"
path = "/Users/sac/ggen-marketplace/packs/repo-as-found-pack"

[[packs]]
name = "repo-load-path-pack"
version = "26.7.20"
path = "/Users/sac/ggen-marketplace/packs/repo-load-path-pack"

[[packs]]
name = "repo-intervention-pack"
version = "26.7.20"
path = "/Users/sac/ggen-marketplace/packs/repo-intervention-pack"

[[packs]]
name = "temporary-works-pack"
version = "26.7.20"
path = "/Users/sac/ggen-marketplace/packs/temporary-works-pack"

[[packs]]
name = "mermaid-pack"
version = "26.7.20"
path = "/Users/sac/ggen-marketplace/packs/mermaid-pack"

# Pack gates as law: executed by ggen sync against the post-inference union
# graph in listed order; any returned row refuses the sync (FM-LAW-018).
# SELECT-rows-are-violations semantics: green = empty result.
[validation]
gates = [
  "/Users/sac/ggen-marketplace/packs/repo-reconciliation-pack/gates/010_delta_classification_required.rq",
  "/Users/sac/ggen-marketplace/packs/repo-reconciliation-pack/gates/020_unknown_delta_must_be_quarantined.rq",
  "/Users/sac/ggen-marketplace/packs/repo-reconciliation-pack/gates/030_deletion_requires_refusal_or_explicit_admission.rq",
  "/Users/sac/ggen-marketplace/packs/repo-reconciliation-pack/gates/040_blocking_obligation_prevents_promotion.rq",
  "/Users/sac/ggen-marketplace/packs/repo-reconciliation-pack/gates/050_receipt_chain_required.rq",
  "/Users/sac/ggen-marketplace/packs/repo-reconciliation-pack/gates/060_red_never_promotes.rq",
]

