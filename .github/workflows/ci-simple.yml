name: CI Simple (for act testing)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Explicit so the fmt/clippy steps below never depend on the
          # action's default profile (beta legs lacked rustfmt).
          components: rustfmt, clippy

      - name: Cache dependencies
        # v4: actionlint flags v3 as "runner too old to run on GitHub
        # Actions" (same finding class TR2 fixed for action-gh-release v1->v2).
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # frozen_duckdb_builder::ensure_binary() looks FIRST in
      # ~/.frozen-duckdb/cache/v<version>-<arch>/libduckdb_<arch>.so. Its
      # fallbacks are unusable on CI (no vendored binary; release download
      # 404s until the operator cuts the v2.0.0 release; post-TR7
      # source-compile fallback is a full ~30-90 min DuckDB build). Keep
      # DUCKDB_VERSION in sync with crates/frozen-duckdb-builder/src/lib.rs.
      # NOTE (2.0.0 lockstep): duckdb/duckdb has no v2.0.0 release
      # assets yet, so releases/download/v2.0.0/libduckdb-linux-amd64.zip
      # 404s and this pre-seed step fails on CI until the dev asset exists —
      # either published via this repo's build-binaries.yml or once upstream
      # cuts the tag.
      - name: Provision DuckDB library (pre-seed builder cache)
        run: |
          set -euo pipefail
          DUCKDB_VERSION="2.0.0"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64)  ASSET="libduckdb-linux-amd64.zip"; ARCH_TAG="x86_64" ;;
            aarch64) ASSET="libduckdb-linux-arm64.zip"; ARCH_TAG="arm64"  ;;
            *) echo "Unsupported linux arch: $ARCH"; exit 1 ;;
          esac
          CACHE_DIR="$HOME/.frozen-duckdb/cache/v${DUCKDB_VERSION}-${ARCH_TAG}"
          mkdir -p "$CACHE_DIR"
          TMP="$(mktemp -d)"
          # Best-effort: the legacy libduckdb-*.zip names 404 at upstream v2.0.0
          # (assets renamed to duckdb-shared-libs-*.tar.gz). On 404 the builder's fenced local-compile fallback from
          # the pinned upstream source SHA supplies the library instead.
          if curl -fL --retry 5 --silent --show-error \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/${ASSET}" \
            -o "$TMP/libduckdb.zip" && [[ -s "$TMP/libduckdb.zip" ]]; then
            unzip -o -q "$TMP/libduckdb.zip" -d "$TMP"
            cp "$TMP/libduckdb.so" "$CACHE_DIR/libduckdb_${ARCH_TAG}.so"
            # -lduckdb resolves the plain name; seed it here so the cache is
            # complete before the builder runs (post-TR7 ensure_link_name links
            # the platform-correct plain name itself; this is belt-and-braces).
            ln -sf "libduckdb_${ARCH_TAG}.so" "$CACHE_DIR/libduckdb.so"
            test -s "$CACHE_DIR/libduckdb_${ARCH_TAG}.so"
            echo "Pre-seeded $CACHE_DIR/libduckdb_${ARCH_TAG}.so"
          else
            echo "::warning::no upstream prebuilt asset at v${DUCKDB_VERSION}; builder will local-compile from pinned source"
          fi
          rm -rf "$TMP"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Run examples
        run: |
          cargo run --example basic_usage
          cargo run --example performance_comparison
