# publish-crates.yml — DISPATCH-ONLY, environment-gated publish workflow.
#
# Operator secret setup (one-time, GitHub UI -> Settings -> Environments -> release):
#   1. Create environment "release" with required reviewers (operator only).
#   2. Add CARGO_REGISTRY_TOKEN (crates.io "me" -> new token, publish-only scope)
#      as an ENVIRONMENT secret on "release", not a repo/org secret.
#   3. Publish jobs reference secrets.CARGO_REGISTRY_TOKEN and fail closed
#      (REFUSED[NO_TOKEN]) when it is absent or empty.
#
# NEVER dispatched by automation: workflow_dispatch only, no push/schedule triggers.
# Dry-run input defaults true — actuation requires an explicit operator flip.

name: publish-crates

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must equal workspace version, no prerelease suffix)"
        required: true
        type: string
      confirm:
        description: 'Must be exactly "publish-<version>"'
        required: true
        type: string
      dry-run:
        description: "Rehearse only: validate + polls, no actuation"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never

jobs:
  validate:
    name: validate (flip-state + gates)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.workspace-version.outputs.version }}
      ok: ${{ steps.workspace-version.outputs.ok }}
    steps:
      - uses: actions/checkout@v4

      - name: confirm guard
        id: confirm-guard
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          confirm="${{ inputs.confirm }}"
          if [ "$confirm" != "publish-$version" ]; then
            echo "::error::REFUSED[CONFIRM_MISMATCH] expected 'publish-$version', got '$confirm'"
            exit 1
          fi
          if [[ "$version" =~ -dev$ || "$version" =~ -[0-9A-Za-z] ]]; then
            echo "::error::REFUSED[DEV_SUFFIX] '$version' carries a prerelease suffix"
            exit 1
          fi

      - name: workspace-version check
        id: workspace-version
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          ws=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$ws" != "$version" ]; then
            echo "::error::REFUSED[FLIP_STATE] workspace version '$ws' != requested '$version'"
            exit 1
          fi
          echo "version=$ws" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: cargo build
        run: cargo build --workspace

      - name: make verify
        run: make verify

  publish-builder:
    name: publish frozen-duckdb-builder
    needs: [validate]
    if: ${{ needs.validate.outputs.ok == 'true' }}
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::REFUSED[NO_TOKEN] CARGO_REGISTRY_TOKEN absent — set it on the 'release' environment"
            exit 1
          fi
          args=(publish --no-verify -p frozen-duckdb-builder)
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "[DRY-RUN] would run: cargo ${args[*]}"
          else
            cargo "${args[@]}"
          fi

  publish-sys:
    name: publish frozen-duckdb-sys (after builder indexed)
    needs: [publish-builder, validate]
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: await builder on crates.io index
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/crate.json -w '%{http_code}' \
              "https://crates.io/api/v1/crates/frozen-duckdb-builder/$version")
            if [ "$code" = "200" ]; then
              found=$(python3 -c 'import json,sys; d=json.load(open("/tmp/crate.json")); print(d["version"]["num"])')
              if [ "$found" = "$version" ]; then
                echo "builder $version indexed"
                exit 0
              fi
            fi
            if [ "$i" = "60" ]; then
              echo "::error::REFUSED[INDEX_TIMEOUT] builder $version not indexed after 60 polls (~5 min)"
              exit 1
            fi
            sleep 5
          done

      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::REFUSED[NO_TOKEN]"
            exit 1
          fi
          args=(publish --no-verify -p frozen-duckdb-sys)
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "[DRY-RUN] would run: cargo ${args[*]}"
          else
            cargo "${args[@]}"
          fi

  publish-main:
    name: publish frozen-duckdb (after sys indexed)
    needs: [publish-sys, validate]
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: await sys on crates.io index
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/crate.json -w '%{http_code}' \
              "https://crates.io/api/v1/crates/frozen-duckdb-sys/$version")
            if [ "$code" = "200" ]; then
              found=$(python3 -c 'import json,sys; d=json.load(open("/tmp/crate.json")); print(d["version"]["num"])')
              if [ "$found" = "$version" ]; then
                echo "sys $version indexed"
                exit 0
              fi
            fi
            if [ "$i" = "60" ]; then
              echo "::error::REFUSED[INDEX_TIMEOUT]"
              exit 1
            fi
            sleep 5
          done

      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::REFUSED[NO_TOKEN]"
            exit 1
          fi
          args=(publish --no-verify -p frozen-duckdb)
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "[DRY-RUN] would run: cargo ${args[*]}"
          else
            cargo "${args[@]}"
          fi
