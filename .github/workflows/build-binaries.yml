name: Build Frozen DuckDB Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Must match the builder pin (const VERSION in crates/frozen-duckdb-builder/src/lib.rs, e.g. v2.0.0-dev); any other value fails the run"
        required: true
        default: "v2.0.0-dev"

jobs:
  build-binaries:
    runs-on: macos-latest
    # The cache-miss path is a full DuckDB source compile (clone + make -j4,
    # 9 extensions + jemalloc on 2 vCPU runners: 30-90 min observed, upper
    # bound untested in CI); this timeout turns a silent hang into a loud,
    # bounded failure (same law as ci.yml's 45). 240 covers the worst leg
    # with 2.5x headroom over the slowest observed CI compile.
    timeout-minutes: 240
    # GH1 run 37940771273: fail-fast canceled the arm64 leg 30s after x86_64
    # failed, so the arm64 outcome is unknown ("canceled" != evidence). Each
    # leg must produce its own signal.
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: |
          # Install CMake and other build dependencies
          brew install cmake

      - name: Preflight (pin + OpenSSL wiring)
        run: |
          set -euo pipefail
          # GH1 run 36239600176 died with no diagnostic; this makes the exact
          # subject of every run visible in the first minute of the log.
          PIN=$(sed -nE 's/^const SOURCE_PIN: &str = "([0-9a-f]{40})";/\1/p' \
            crates/frozen-duckdb-builder/src/lib.rs)
          echo "SOURCE_PIN resolved to: ${PIN}"
          test -n "${PIN}"

          # GH1 run 37940771273: the httpfs loadable extension's vendored
          # httplib+OpenSSL linked without -lssl/-lcrypto on the x86_64 leg
          # (`_SSL_*`/`_X509_*` undefined). CMake's FindOpenSSL honors
          # OPENSSL_ROOT_DIR, which the builder passes through to cmake via
          # the inherited environment. Install the keg and point the leg at
          # it before the build step. Extension set stays intact (builder
          # parity is load-bearing; no trimming).
          brew install openssl@3
          case "${{ matrix.arch }}" in
            arm64)
              echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
              ;;
            x86_64)
              # macOS runners are arm64; brew's openssl@3 is an arm64 keg, and
              # linking an x86_64 slice against arm64 libs fails. Try the
              # Rosetta x86_64 brew keg first; if absent, fail loudly here
              # (bounded, 2 minutes) instead of 15 minutes into make.
              if [ -x /usr/local/bin/brew ]; then
                X64_SSL="$(arch -x86_64 /usr/local/bin/brew --prefix openssl@3 2>/dev/null || true)"
                if [ -z "${X64_SSL}" ]; then
                  echo "x86_64 openssl keg absent — installing via Rosetta brew" >&2
                  arch -x86_64 /usr/local/bin/brew install openssl@3 2>/dev/null || true
                  X64_SSL="$(arch -x86_64 /usr/local/bin/brew --prefix openssl@3 2>/dev/null || true)"
                fi
                if [ -n "$X64_SSL" ] && [ -d "$X64_SSL/lib" ]; then
                  echo "OPENSSL_ROOT_DIR=${X64_SSL}" >> "$GITHUB_ENV"
                else
                  echo "No x86_64 openssl@3 keg via Rosetta brew; exporting arm64 prefix anyway - link failure will be loud and diagnostic-rich." >&2
                  echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
                fi
              else
                echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
              fi
              ;;
          esac
          echo "OPENSSL_ROOT_DIR=$( cat "$GITHUB_ENV" | sed -n 's/^OPENSSL_ROOT_DIR=//p' )"

      - name: Set architecture
        run: |
          case "${{ matrix.arch }}" in
            x86_64|arm64) ;;
            *)
              echo "Unsupported matrix arch: ${{ matrix.arch }}"
              exit 1
              ;;
          esac
          echo "ARCH=${{ matrix.arch }}" >> "$GITHUB_ENV"
          # macos-latest is an arm64 runner: uname -m reports arm64 even on the
          # x86_64 matrix leg, so the local-compile fallback must be told the
          # target slice explicitly. CMAKE_OSX_ARCHITECTURES labels the slice
          # clang emits. TR7 CLOSED (v26.9.26): the builder now derives
          # detection AND cache placement from CMAKE_OSX_ARCHITECTURES/ARCH
          # (falling back to uname -m), so the x86_64 leg lands under
          # v2.0.0-dev-x86_64/libduckdb_x86_64.dylib and the find step below
          # resolves. Both env vars are exported here per leg.
          echo "CMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}" >> "$GITHUB_ENV"

      - name: Guard version input
        run: |
          set -euo pipefail
          # The builder pins the DuckDB version (const VERSION in
          # crates/frozen-duckdb-builder/src/lib.rs); before this guard a
          # dispatch for any other version silently built the pinned one.
          # Fail loudly instead (証: the input must not lie about capability).
          # GH6 audit: the guard was dispatch-only — a v2.0.0-dev tag push
          # built and released fully unguarded. Both admission paths now pass
          # through the same check (fail-closed kept).
          BUILDER_VERSION="2.0.0-dev"
          WANT="v${BUILDER_VERSION}"
          case "${{ github.event_name }}" in
            workflow_dispatch) GOT="${{ inputs.version }}" ;;
            push) GOT="${{ github.ref_name }}" ;;
            *)
              echo "Unsupported event: ${{ github.event_name }}" >&2
              exit 1
              ;;
          esac
          if [[ "$GOT" != "$WANT" ]]; then
            echo "${{ github.event_name }} version='${GOT}' does not match the builder pin ${WANT}; refusing to build the wrong version silently." >&2
            exit 1
          fi

      - name: Build mega-library
        run: |
          # GH1 run 36239600176: the v1.5.5 log had a ~10.5-min silent gap
          # (last cargo line -> failure line, zero compiler output). set -x
          # keeps every command visible in the log so the next failure
          # carries its diagnostics, same law as the builder's anyhow {:#}
          # chains.
          set -euxo pipefail
          # Create a temporary project to build the mega-library
          mkdir -p /tmp/frozen-build
          cd /tmp/frozen-build

          # Create a minimal Cargo.toml that depends on frozen-duckdb-builder
          mkdir -p src
          cat > Cargo.toml << 'EOF'
          [package]
          name = "frozen-build"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          frozen-duckdb-builder = { path = "${{ github.workspace }}/crates/frozen-duckdb-builder" }
          EOF

          # Create a build script that compiles the mega-library
          cat > src/main.rs << 'EOF'
          use frozen_duckdb_builder::ensure_binary;

          fn main() {
              match ensure_binary() {
                  Ok(path) => println!("Built mega-library: {}", path.display()),
                  Err(e) => {
                      // {:#}, not {}: the anyhow chain carries the captured
                      // cmake/make stderr — the v1.5.5 tag run died with only
                      // (HISTORICAL: pre-2.0.0-dev; kept as evidence)
                      // "Failed to compile DuckDB locally" and no diagnostic.
                      eprintln!("Failed to build mega-library: {:#}", e);
                      std::process::exit(1);
                  }
              }
          }
          EOF

          # Build the mega-library
          cargo run --release

      - name: Find built binary
        run: |
          # frozen-duckdb-builder::ensure_binary() downloads
          # releases/download/v{VERSION}/libduckdb_{arch}.dylib, so the released
          # asset must carry exactly that name. The versioned cache also stores
          # it under that name (the legacy libfrozen_mega_* name is no longer
          # produced by the builder).
          BINARY_PATH=$(find "$HOME/.frozen-duckdb/cache" -path "*/v*/libduckdb_${{ matrix.arch }}.dylib" | head -1)
          if [ -z "$BINARY_PATH" ]; then
            echo "Could not find built binary"
            exit 1
          fi
          mkdir -p stage
          cp "$BINARY_PATH" "stage/libduckdb_${{ matrix.arch }}.dylib"
          echo "Staged asset: stage/libduckdb_${{ matrix.arch }}.dylib (from $BINARY_PATH)"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: libduckdb_${{ matrix.arch }}
          path: stage/libduckdb_${{ matrix.arch }}.dylib

  # REL7: Linux prebuilt legs (REL6's flags, native runners — the container/
  # docker-in-docker route is unnecessary because ubuntu runners ARE Linux).
  # x86_64 builds on ubuntu-latest; arm64 builds natively on ubuntu-24.04-arm
  # (free for public repos) so no cross-toolchain is needed. The builder's
  # Linux path is already exercised: library_extension_for("linux") == "so",
  # cmake_osx_architectures_for("linux", ..) == None (flag not passed), and
  # ensure_install_id is a macOS-only no-op (lib.rs:886). Asset names follow
  # release_asset_name_for: libduckdb_{x86_64,arm64}.so.
  build-binaries-linux:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # cmake + C++ toolchain for the DuckDB compile; libssl-dev for the
          # httpfs extension's OpenSSL linkage (the macOS legs' brew openssl@3
          # equivalent — on Linux the system keg is the right slice by
          # construction, no OPENSSL_ROOT_DIR needed).
          sudo apt-get install -y cmake g++ libssl-dev libcurl4-openssl-dev ninja-build

      - name: Preflight (pin visible in the first minute)
        run: |
          set -euo pipefail
          PIN=$(sed -nE 's/^const SOURCE_PIN: &str = "([0-9a-f]{40})";/\1/p' \
            crates/frozen-duckdb-builder/src/lib.rs)
          echo "SOURCE_PIN resolved to: ${PIN}"
          test -n "${PIN}"

      - name: Guard version input
        run: |
          set -euo pipefail
          # Same admission guard as the macOS legs (GH6 audit): both dispatch
          # and tag-push paths must match the builder pin.
          BUILDER_VERSION="2.0.0-dev"
          WANT="v${BUILDER_VERSION}"
          case "${{ github.event_name }}" in
            workflow_dispatch) GOT="${{ inputs.version }}" ;;
            push) GOT="${{ github.ref_name }}" ;;
            *)
              echo "Unsupported event: ${{ github.event_name }}" >&2
              exit 1
              ;;
          esac
          if [[ "$GOT" != "$WANT" ]]; then
            echo "${{ github.event_name }} version='${GOT}' does not match the builder pin ${WANT}; refusing to build the wrong version silently." >&2
            exit 1
          fi

      - name: Build mega-library
        run: |
          # Same temp-project + ensure_binary() harness as the macOS legs
          # (set -x so any silent gap carries diagnostics). On Linux the
          # builder never passes CMAKE_OSX_ARCHITECTURES and the native
          # runner's uname -m is already the target slice, so no arch env is
          # exported here.
          set -euxo pipefail
          mkdir -p /tmp/frozen-build
          cd /tmp/frozen-build
          mkdir -p src
          cat > Cargo.toml << 'EOF'
          [package]
          name = "frozen-build"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          frozen-duckdb-builder = { path = "${{ github.workspace }}/crates/frozen-duckdb-builder" }
          EOF
          cat > src/main.rs << 'EOF'
          use frozen_duckdb_builder::ensure_binary;

          fn main() {
              match ensure_binary() {
                  Ok(path) => println!("Built mega-library: {}", path.display()),
                  Err(e) => {
                      eprintln!("Failed to build mega-library: {:#}", e);
                      std::process::exit(1);
                  }
              }
          }
          EOF
          cargo run --release

      - name: Find built binary
        run: |
          # Asset law (TR7): on Linux the cache holds libduckdb_{arch}.so and
          # the release asset must carry exactly that name (download_from_github_release
          # requests libduckdb_{arch}.so). Same find discipline as the macOS legs.
          BINARY_PATH=$(find "$HOME/.frozen-duckdb/cache" -path "*/v*/libduckdb_${{ matrix.arch }}.so" | head -1)
          if [ -z "$BINARY_PATH" ]; then
            echo "Could not find built binary"
            exit 1
          fi
          mkdir -p stage
          cp "$BINARY_PATH" "stage/libduckdb_${{ matrix.arch }}.so"
          echo "Staged asset: stage/libduckdb_${{ matrix.arch }}.so (from $BINARY_PATH)"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: libduckdb_${{ matrix.arch }}-linux
          # Suffix the artifact name so it cannot collide with the macOS
          # libduckdb_{arch} artifacts of the same arch label.
          path: stage/libduckdb_${{ matrix.arch }}.so

  release:
    needs: [build-binaries, build-binaries-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/')
    # GH6 audit: read-only repo defaults 403 the release step. The release
    # job needs exactly contents:write — nothing else.
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Frozen DuckDB ${{ github.ref_name }}
          body: |
            Pre-built Frozen DuckDB mega-libraries for ${{ github.ref_name }}

            ## Architecture Support
            - **x86_64**: Intel/AMD 64-bit processors (macOS dylib + Linux .so)
            - **arm64**: Apple Silicon (M1/M2) dylib + Linux aarch64 .so

            ## Usage
            These binaries are automatically downloaded by `frozen-duckdb` on first use.
            No manual installation required.

            ## Features Included
            - DuckDB v2.0.0-dev with the bundled extension set
              (parquet, json, icu, httpfs, tpch, tpcds, fts, inet, sqlsmith;
              jemalloc + autoload enabled)
            - Apache Arrow integration
            - ICU internationalization
          files: |
            libduckdb_x86_64/libduckdb_x86_64.dylib
            libduckdb_arm64/libduckdb_arm64.dylib
            libduckdb_x86_64-linux/libduckdb_x86_64.so
            libduckdb_arm64-linux/libduckdb_arm64.so
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
