# Cargo configuration for optimal caching
[build]
# Use more parallel jobs for faster compilation
# jobs = 0 # Use all available CPU cores (commented out to avoid "jobs may not be 0" error)

# Enable incremental compilation
incremental = true

# Use sccache for distributed compilation caching
[env]
RUSTC_WRAPPER = "sccache"

# Registry configuration for faster downloads
[registry]
default = "crates-io"

# Note: sparse is cargo's default registry protocol since 1.68 — no config
# key needed (an explicit `[source.crates-io] protocol = "sparse"` here
# triggers "unused config key" on modern cargo, so it's omitted).

# Network configuration
[net]
# Use git CLI for faster git operations
git-fetch-with-cli = true

# Retry configuration
retry = 3
