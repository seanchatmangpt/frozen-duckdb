[package]
name = "frozen-duckdb"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

description = "Drop-in replacement for the duckdb (duckdb-rs) crate: same API, backed by pre-compiled DuckDB binaries for fast Rust builds"

# AD8 package audit (docs/sjira/v2.0.0-dev/receipts/AD8-PACKAGE-AUDIT.md):
# these are machine-local value-audit / fleet-court / rev-court fixtures —
# they reference hard-coded operator-home absolute paths and /tmp lane
# fixtures and are meaningless (and leaking) outside this checkout. They
# remain tracked and runnable in-repo; excluded from the crates.io package.
exclude = [
    "tests/gate_v01_latency.rs",
    "tests/test_fleet_class_a_workstation.rs",
    "tests/test_fleet_class_b_industrial.rs",
    "tests/test_fleet_class_c_retail.rs",
    "tests/test_fleet_class_d_marine.rs",
    "tests/test_fleet_class_e_telco.rs",
    "tests/test_rev_clean_room.rs",
    "tests/test_rev_compliance.rs",
    "tests/test_rev_edge_autonomy.rs",
    "tests/test_rev_process_mining.rs",
    "tests/value_audit_amplitude.rs",
    "tests/value_audit_celonis.rs",
    "tests/value_audit_datadog.rs",
]

[lib]
# Vendored duckdb-rs doc examples are illustrative pseudo-code written for the
# upstream `duckdb` crate name (and `?` without a Result main); they are not
# runnable doctests in this fork. Unit/integration tests remain the gate.
doctest = false

[[bin]]
name = "frozen-duckdb-cli"
path = "src/main.rs"
# PB10-F2: the CLI prints JSON output via serde_json; with the dep now
# optional and NOT in default features, `cargo build`/`cargo install`
# without `--features serde_json` skips this bin (silently, per cargo
# semantics). Operators wanting the CLI: enable the feature.
required-features = ["serde_json"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
# PB10-F2: optional — compiled only when the `serde_json` feature is on
serde_json = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true
reqwest.workspace = true

# Dependencies carried over from the vendored duckdb-rs API layer
arrow = { version = "56", default-features = false, features = ["ffi", "prettyprint"] }
cast = "0.3"
fallible-iterator = "0.3"
fallible-streaming-iterator = "0.1"
hashlink = "0.10"
rust_decimal = "1.14"
strum = { version = "0.27", features = ["derive"] }

# Use our FFI crate instead of duckdb-rs
frozen-duckdb-sys = { path = "../frozen-duckdb-sys", version = "2.0.0-dev" }

[[test]]
name = "host_vfs_local"
required-features = ["vtab"]

[features]
# CL13 (KD-06 local slice): declares the previously-undeclared cfg gate
# `feature = "vtab"` used throughout src/duckdb/vtab/ and host_vfs.rs.
# Without this declaration the cfg was always-false and the whole vtab
# surface (table-function registration) was unreachable dead code.
vtab = []
# PB10-F2: load-bearing — cfg(feature = "serde_json") at src/duckdb/types/mod.rs:20
# gates the FromSql/ToSql impls for serde_json::Value (src/duckdb/types/serde_json.rs)
# AND the optional dependency itself: with the feature off, consumers do not
# compile serde_json through this crate at all. The vendored duckdb-rs
# cfg(test) code does not touch serde_json outside the gated module; the CLI
# bin is required-features-gated above.
serde_json = ["dep:serde_json"]

[dev-dependencies]
# Used by vendored cfg(test) modules ported from duckdb-rs (do not churn)
pretty_assertions = "1"
# variant_tests.rs: FromSql<serde_json::Value> round trip against VARIANT
serde_json = "1"

[[example]]
name = "dropin_replacement"
path = "examples/dropin_replacement.rs"

[[example]]
name = "flock_ollama_integration"
path = "examples/flock_ollama_integration.rs"
